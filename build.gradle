buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "github"
            url = "https://github.com/juanmuscaria/maven/raw/master"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle2:[2.3-1.0.0-SNAPSHOT,)'
    }
}

repositories {
	flatDir {
		dirs 'deps'
	}
}

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_archives_name

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
	// Single-sourced from gradle.properties — see the ceiling note on forge_version there.
	version = "${mc_version}-${forge_version}"
    mappings = "stable_39"
	runDir = "eclipse"

	replace '@VERSION@', project.version
	replaceIn 'SophisticatedCoreLegacy.java'
}

processResources {

	// Gradle does not treat `expand` values as task inputs, so without declaring them
	// here the task stays UP-TO-DATE across a version bump and the jar ships an
	// mcmod.info still claiming the previous version.
	inputs.property 'version', project.version
	inputs.property 'mod_id', mod_id
	inputs.property 'mod_name', mod_name
	inputs.property 'mod_author', mod_author
	inputs.property 'mod_description', mod_description
	inputs.property 'mod_credits', mod_credits
	inputs.property 'mod_url', mod_url
	inputs.property 'mc_version', mc_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version,
		'mod_id': mod_id,
		'mod_name': mod_name,
		'mod_author': mod_author,
		'mod_description': mod_description,
		'mod_credits': mod_credits,
		'mod_url': mod_url,
		'mc_version': mc_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

dependencies {
	// JEI/HEI: compiled against only. The plugin class is only ever loaded by JEI itself.
	compileOnly name: 'jei_1.12.2-4.16.1.1012'
	// Inventory Tweaks API annotations only (invtweaks/api, taken from an InventoryTweaks jar). An
	// annotation whose class is missing at runtime is simply ignored, so nothing needs InvTweaks.
	compileOnly name: 'invtweaks-api-1.64'
}

// An MCP-named jar for the mods built on Core to compile and run their dev clients against.
// The release jar (build/libs, reobfuscated to SRG names) is what goes into real instances.
task devJar(type: Jar) {
	from sourceSets.main.output
	classifier = 'dev'
}

// Puts the dev jar into the deps/ folders of Backpacks Legacy and Storage Legacy. Run after
// any Core change. Older Core jars are removed first, so a version bump never leaves two
// copies there.
task copyToDependents(dependsOn: 'devJar') {
	doLast {
		['SophisticatedBackpacksLegacy', 'SophisticatedStorageLegacy'].each { name ->
			def depsDir = file("../${name}/deps")
			if (depsDir.isDirectory()) {
				fileTree(depsDir).matching { include 'SophisticatedCoreLegacy-*.jar' }.each { it.delete() }
				copy {
					from devJar.archivePath
					// Core's containers carry this API's annotation, so dependents compile against it too.
					from 'deps/invtweaks-api-1.64.jar'
					into depsDir
				}
			}
		}
	}
}

// No deployToInstance task here on purpose: the machine-wide `deployDir` in
// ~/.gradle/gradle.properties points at one specific instance, and copying a
// versioned jar there on every build is how duplicate-modid crashes happen.

// reobfJar rewrites the jar in place, so Gradle can call it up to date after something else
// (runServer, runClient) has rebuilt the jar with MCP names, and ship that unmapped jar.
reobfJar.outputs.upToDateWhen { false }

// The GPL text ships inside the jar, as the licence asks of anyone passing the binary on.
jar {
	from('LICENSE') {
		rename { "LICENSE_${project.archivesBaseName}" }
	}
}
